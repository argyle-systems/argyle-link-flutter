name: publish-sdk
on:
  push:
    tags:
      - '*.*.*'
jobs:
  publish-sdk:
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - id: tag
        run: echo "DEPLOY_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set SDK version
        run: |
          sed -i "s/version: \"0.0.1\" # %LINK_VERSION%/version: \"${{ steps.tag.outputs.DEPLOY_TAG }}\"/g" pubspec.yaml

      - name: Publish
        run: flutter pub publish --force
